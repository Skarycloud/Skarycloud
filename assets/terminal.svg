<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-label="Terminal: whoami prints Sumanth Kumar, full-stack developer and AI product builder; ./ship runs design, build, test, ship and AI steps">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; }
    .p { fill: #ECC47E; }
    .c { fill: #e6edf3; }
    .o { fill: #8b949e; }
    .ok { fill: #3fb950; }
    .k { fill: #ECC47E; }
    .t { fill: #8b949e; font-size: 12px; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }

    .l { opacity: 0; animation: in .35s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .type { transform-box: fill-box; transform-origin: right center; animation-name: type; animation-fill-mode: both; }
    @keyframes type { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    .cursor { opacity: 0; animation: in .1s 6.4s forwards, blink 1s 6.5s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .l, .cursor { opacity: 1; animation: none; }
      .type { display: none; }
    }
  </style>

  <defs>
    <clipPath id="win"><rect x="0.5" y="0.5" width="859" height="339" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="860" height="340" fill="#0d1117"/>
    <rect width="860" height="36" fill="#161b22"/>
    <line x1="0" y1="36" x2="860" y2="36" stroke="#30363d"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="18" r="6" fill="#febc2e"/>
    <circle cx="62" cy="18" r="6" fill="#28c840"/>
    <text class="t" x="430" y="22" text-anchor="middle">sumanth@skarycloud: ~</text>

    <!-- $ whoami -->
    <text x="28" y="72" xml:space="preserve"><tspan class="p">$ </tspan><tspan class="c">whoami</tspan></text>
    <rect class="type" x="44" y="56" width="58" height="22" fill="#0d1117" style="animation-duration:.6s;animation-delay:.5s;animation-timing-function:steps(6)"/>

    <text class="l o" x="28" y="98" style="animation-delay:1.3s">sumanth kumar · full-stack developer &amp; AI product builder · mangalore, india</text>

    <!-- $ ./ship -->
    <g class="l" style="animation-delay:1.7s">
      <text x="28" y="132" xml:space="preserve"><tspan class="p">$ </tspan><tspan class="c">./ship --idea "your next product"</tspan></text>
      <rect class="type" x="44" y="116" width="284" height="22" fill="#0d1117" style="animation-duration:1.4s;animation-delay:1.9s;animation-timing-function:steps(33)"/>
    </g>

    <text class="l" x="28" y="162" xml:space="preserve" style="animation-delay:3.6s"><tspan class="ok">  ✓ </tspan><tspan class="k">design  </tspan><tspan class="o">figma · ui/ux · design systems</tspan></text>
    <text class="l" x="28" y="186" xml:space="preserve" style="animation-delay:4.0s"><tspan class="ok">  ✓ </tspan><tspan class="k">build   </tspan><tspan class="o">react · next.js · react native · node.js · supabase</tspan></text>
    <text class="l" x="28" y="210" xml:space="preserve" style="animation-delay:4.4s"><tspan class="ok">  ✓ </tspan><tspan class="k">test    </tspan><tspan class="o">qa &amp; test engineering @ mirchi35</tspan></text>
    <text class="l" x="28" y="234" xml:space="preserve" style="animation-delay:4.8s"><tspan class="ok">  ✓ </tspan><tspan class="k">ship    </tspan><tspan class="o">vercel · google play · real users</tspan></text>
    <text class="l" x="28" y="258" xml:space="preserve" style="animation-delay:5.2s"><tspan class="ok">  ✓ </tspan><tspan class="k">ai      </tspan><tspan class="o">agents · gemini · google adk · transformers.js</tspan></text>

    <text class="l" x="28" y="292" xml:space="preserve" style="animation-delay:5.8s"><tspan class="p">→ </tspan><tspan class="c">shipped. got an idea? </tspan><tspan class="k">sumanth.k.0202@gmail.com</tspan></text>

    <text class="l" x="28" y="320" style="animation-delay:6.3s"><tspan class="p">$</tspan></text>
    <rect class="cursor" x="44" y="306" width="9" height="18" fill="#e6edf3"/>
  </g>
  <rect x="0.5" y="0.5" width="859" height="339" rx="12" fill="none" stroke="#30363d"/>
</svg>
