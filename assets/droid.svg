<svg xmlns="http://www.w3.org/2000/svg" width="240" height="260" viewBox="0 0 240 260" role="img" aria-label="A small floating droid waving hello">
  <style>
    .float { animation: float 3.2s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .shadow { animation: shadow 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: .35; } 50% { transform: scaleX(.72); opacity: .15; } }

    .eye { animation: blink 4.6s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.1); } }

    .look { animation: look 7s ease-in-out infinite; }
    @keyframes look { 0%, 35%, 100% { transform: translateX(0); } 45%, 60% { transform: translateX(-5px); } 70%, 85% { transform: translateX(4px); } }

    .wave { animation: wave 1.4s ease-in-out infinite; transform-box: view-box; transform-origin: 152px 166px; }
    @keyframes wave { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-28deg); } }

    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

    .flame { animation: flame .18s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: top center; }
    @keyframes flame { from { transform: scaleY(.75); opacity: .7; } to { transform: scaleY(1.15); opacity: 1; } }

    .bubble { animation: pop 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 85% 100%; }
    @keyframes pop {
      0%, 6% { opacity: 0; transform: scale(.6); }
      12%, 72% { opacity: 1; transform: scale(1); }
      80%, 100% { opacity: 0; transform: scale(.6); }
    }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- ground shadow -->
  <ellipse class="shadow" cx="120" cy="244" rx="40" ry="6" fill="#8b949e"/>

  <!-- speech bubble -->
  <g class="bubble">
    <path d="M14 12 h82 a12 12 0 0 1 12 12 v12 a12 12 0 0 1 -12 12 h-6 l8 12 l-18 -12 h-66 a12 12 0 0 1 -12 -12 v-12 a12 12 0 0 1 12 -12 z" fill="#ECC47E"/>
    <text x="56" y="35" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d1117">hey there!</text>
  </g>

  <g class="float">
    <!-- antenna -->
    <line x1="120" y1="72" x2="120" y2="52" stroke="#e6edf3" stroke-width="2" stroke-linecap="round"/>
    <circle class="pulse" cx="120" cy="47" r="5.5" fill="#ECC47E"/>

    <!-- ears -->
    <rect x="61" y="98" width="10" height="24" rx="5" fill="#161b22" stroke="#e6edf3" stroke-width="1.6"/>
    <rect x="169" y="98" width="10" height="24" rx="5" fill="#161b22" stroke="#e6edf3" stroke-width="1.6"/>

    <!-- head -->
    <rect x="70" y="72" width="100" height="78" rx="34" fill="#161b22" stroke="#e6edf3" stroke-width="1.8"/>
    <rect x="82" y="90" width="76" height="40" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    <g class="look">
      <rect class="eye" x="99" y="102" width="11" height="14" rx="5.5" fill="#ECC47E"/>
      <rect class="eye" x="130" y="102" width="11" height="14" rx="5.5" fill="#ECC47E"/>
    </g>
    <path d="M113 122 q7 5 14 0" fill="none" stroke="#ECC47E" stroke-width="2" stroke-linecap="round"/>

    <!-- neck -->
    <rect x="112" y="150" width="16" height="6" rx="2" fill="#30363d"/>

    <!-- left arm (resting) -->
    <path d="M88 168 q-16 10 -14 28" fill="none" stroke="#e6edf3" stroke-width="5" stroke-linecap="round"/>
    <circle cx="74" cy="198" r="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.6"/>

    <!-- right arm (waving) -->
    <g class="wave">
      <path d="M152 166 q16 -6 20 -26" fill="none" stroke="#e6edf3" stroke-width="5" stroke-linecap="round"/>
      <circle cx="173" cy="136" r="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.6"/>
    </g>

    <!-- body -->
    <rect x="86" y="156" width="68" height="52" rx="22" fill="#161b22" stroke="#e6edf3" stroke-width="1.8"/>
    <circle class="pulse" cx="120" cy="178" r="6" fill="#ECC47E"/>
    <line x1="104" y1="194" x2="136" y2="194" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>

    <!-- thruster -->
    <rect x="110" y="208" width="20" height="6" rx="3" fill="#30363d"/>
    <path class="flame" d="M113 215 q7 18 14 0 z" fill="#ECC47E"/>
  </g>
</svg>
